<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }}</title>
{% set icon = config.sprites.get('brickSuper') or config.sprites.get('overlay') %}
<link rel="icon" href="{{ icon or url_for('static', filename='icon.png') }}">
<style>
  html,body{height:100%;margin:0}
  body{
    color:#e8ecf8; font:15px/1.4 system-ui,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;
  }
  /* animated background sits behind everything and never eats clicks */
  #bgLayer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  #bgLayer iframe{width:100%;height:100%;border:0;display:block}
  /* logo overlay: above the background, below the board, never clickable */
  #logoLayer{position:fixed;inset:0;z-index:1;pointer-events:none;
             background-repeat:no-repeat;background-position:center}
  /* lift page content above the background - but not #overlay, which must stay fixed */
  body > *:not(#bgLayer):not(#logoLayer):not(#overlay){position:relative;z-index:2}

  #hud{display:flex;gap:26px;font-variant-numeric:tabular-nums;letter-spacing:.05em;font-size:14px}
  #hud b{font-weight:600}
  #who{font-size:13px;opacity:.55;min-height:16px}
  /* 16:9 board, filling whichever axis runs out first - the screen at an event
     is nearly always 16:9, so this leaves almost no margin */
  canvas{width:min(98vw, calc(88vh * 16 / 9));height:auto;touch-action:none;display:block}
  /* the frame is chrome only - without it the board bleeds into the background */
  canvas.framed{border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 60px -20px #000}
  #help{font-size:12.5px;opacity:.45;text-align:center}

  /* ---- overlays ---- */
  /* The sheets take their colours from the instance: --sheet-bg is the board
     colour, --sheet-line the accent at low alpha, text the page text colour. */
  #overlay{
    position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;
    background:var(--scrim,rgba(4,6,12,.72));backdrop-filter:blur(3px);padding:20px;
  }
  #overlay.on{display:flex}
  .sheet{
    width:100%;max-width:400px;background:var(--sheet-bg,#111629);
    border:1px solid var(--sheet-line,#232c47);color:var(--text,#e8ecf8);
    border-radius:12px;padding:22px;box-shadow:0 30px 80px -30px #000;
  }
  .sheet h2{margin:0 0 4px;font-size:19px;color:var(--accent-text,#e8ecf8)}
  .sheet p{margin:0 0 16px;font-size:13.5px;opacity:.65}
  .sheet input[type=text]{
    width:100%;background:var(--sheet-input,#0a0e1c);border:1px solid var(--sheet-line,#232c47);
    color:var(--text,#e8ecf8);
    padding:10px 12px;border-radius:8px;font:inherit;box-sizing:border-box;
  }
  .sheet input:focus{outline:none;border-color:var(--accent,#4cc9f0)}
  .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .b{
    flex:1;min-width:120px;background:var(--sheet-input,#161d33);
    border:1px solid var(--sheet-line,#232c47);color:var(--text,#e8ecf8);
    padding:10px 14px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;
  }
  .b:hover{border-color:var(--accent,#3b4a76)}
  .b.primary{background:var(--accent,#4cc9f0);border-color:var(--accent,#4cc9f0);
             color:var(--sheet-bg,#04121a);font-weight:600}
  .big{font-size:34px;font-weight:700;margin:6px 0 2px;color:var(--accent-text,#4cc9f0);
       font-variant-numeric:tabular-nums}

  /* ---- leaderboard ---- */
  ol.board{list-style:none;margin:0 0 4px;padding:0;max-height:46vh;overflow-y:auto}
  ol.board li{display:flex;align-items:baseline;gap:10px;padding:7px 2px;
              border-bottom:1px solid var(--sheet-line,#1b2338);font-size:14px}
  ol.board li:last-child{border-bottom:0}
  ol.board .rank{width:24px;opacity:.45;font-size:12.5px;text-align:right}
  ol.board .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  ol.board .sc{font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent-text,#4cc9f0)}
  ol.board .lv{opacity:.4;font-size:12px;width:44px;text-align:right}
  ol.board li.me{background:rgba(255,255,255,.05);border-radius:6px}
  .none{opacity:.5;font-size:13.5px;padding:14px 0}

  /* ---- background presets ---- */
  .preset-bg{position:absolute;inset:-10%}
  .starfield{
    background:
      radial-gradient(1.6px 1.6px at 20% 30%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 70% 60%, #fff, transparent),
      radial-gradient(1.8px 1.8px at 40% 80%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 85% 15%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 10% 70%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 55% 20%, #fff, transparent);
    background-size:340px 340px;opacity:.55;animation:drift 90s linear infinite;
  }
  .aurora{
    background:
      radial-gradient(50% 40% at 20% 30%, var(--a1,#4cc9f0) 0%, transparent 70%),
      radial-gradient(45% 35% at 75% 60%, var(--a2,#f72585) 0%, transparent 70%),
      radial-gradient(40% 30% at 50% 85%, var(--a3,#3ddc97) 0%, transparent 70%);
    filter:blur(50px);opacity:.35;animation:sway 24s ease-in-out infinite alternate;
  }
  .scanlines{
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 4px);
    animation:scan 8s linear infinite;
  }
  .drift{
    background-image:linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size:48px 48px;animation:drift 40s linear infinite;
  }
  @keyframes drift{ to{ background-position:340px 340px } }
  @keyframes sway{ from{ transform:translate3d(-4%,-2%,0) scale(1) }
                   to{ transform:translate3d(4%,3%,0) scale(1.15) } }
  @keyframes scan{ to{ background-position:0 40px } }
  @media (prefers-reduced-motion: reduce){ .preset-bg{ animation:none } }
</style>
</head>
<body>
<div id="bgLayer"></div>
<div id="logoLayer"></div>

<div id="hud">
  <span>WYNIK <b id="score">0</b></span>
  <span>ŻYCIA <b id="lives">3</b></span>
  <span id="levelBox">POZIOM <b id="level">1</b></span>
  <span id="timeBox" hidden>CZAS <b id="time">--</b></span>
</div>
<div id="who"></div>
<canvas id="c" width="1280" height="720"></canvas>
<div id="help">Ruch: mysz / strzałki &middot; Start: klik lub spacja &middot; Pauza: Esc &middot; <b>Wyniki: P</b></div>

<div id="overlay"><div class="sheet" id="sheet"></div></div>

{% for lib in meta.libs %}<script src="{{ url_for('static', filename=lib) }}"></script>
{% endfor %}<script src="{{ url_for('static', filename=meta.engine) }}"></script>
<script>
let CONFIG = {{ config|tojson }};
const PREVIEW = {{ 'true' if preview else 'false' }};
const SLUG = {{ slug|tojson }};
let TOKEN = {{ token|tojson }};
let SCORES = {{ scores|tojson }};

const ENGINE = {{ meta.engine.split('/')[-1].replace('.js','')|tojson }};
const $ = id => document.getElementById(id);
const makeGame = () => Arcade[ENGINE]($('c'), CONFIG, { onHud: hud, onGameOver: gameOver });
const hex2rgb = h => {
  const n = parseInt(String(h || '#000000').slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const mixHex = (a, b, t) => {
  const A = hex2rgb(a), B = hex2rgb(b);
  const c = A.map((v, i) => Math.round(v + (B[i] - v) * t));
  return 'rgb(' + c.join(',') + ')';
};
const rgba = (h, a) => {
  const c = String(h).startsWith('#') ? hex2rgb(h) : String(h).match(/\d+/g).map(Number);
  return 'rgba(' + c.slice(0, 3).join(',') + ',' + a + ')';
};

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

let game = null, player = '', lastScore = null, overlayMode = null;
const WIN_FX_MS = 1700;   // how long the explosion plays before the score sheet

/* ---------------- background + chrome ---------------- */
function paintChrome(cfg){
  document.body.style.background = cfg.bgStyle === 'flat'
    ? cfg.pageBg
    : 'radial-gradient(circle at 50% -5%, ' + cfg.bg + ' 0%, ' + cfg.pageBg + ' 65%)';
  document.body.style.color = cfg.textColor || cfg.paddleColor;
  document.body.style.setProperty('--accent', cfg.accent);
  document.body.style.setProperty('--accent-text', cfg.accentTextColor || cfg.accent);
  document.body.style.setProperty('--text', cfg.textColor || cfg.paddleColor);
  // sheets sit on the board colour, lifted slightly so they read against the page
  const S = document.body.style;
  S.setProperty('--sheet-bg', mixHex(cfg.bg, cfg.pageBg, 0.5));
  S.setProperty('--sheet-input', mixHex(cfg.bg, '#000000', 0.25));
  S.setProperty('--sheet-line', rgba(cfg.accent, 0.35));
  S.setProperty('--scrim', rgba(mixHex(cfg.bg, '#000000', 0.5), 0.72));
  $('c').classList.toggle('framed', cfg.frame !== false);
  paintOverlay(cfg);
  const at = cfg.accentTextColor || cfg.accent;
  for(const id of ['score','lives','level','time']) $(id).style.color = at;
  paintBackground(cfg);
}

/* A transparent PNG (a logo, typically) layered over the background. Sized as a
   percentage of the smaller viewport edge so it holds up on any screen. */
const OVERLAY_POS = {
  'center': 'center center', 'top': 'center top', 'bottom': 'center bottom',
  'top-left': 'left top', 'top-right': 'right top',
  'bottom-left': 'left bottom', 'bottom-right': 'right bottom'
};
function paintOverlay(cfg){
  const layer = $('logoLayer');
  const url = (cfg.sprites || {}).overlay;
  if(!url){ layer.style.backgroundImage = 'none'; return; }
  const pct = Math.max(5, Math.min(100, +cfg.overlaySize || 40));
  layer.style.backgroundImage = 'url("' + url + '")';
  layer.style.backgroundSize = cfg.overlayTile ? (pct + 'vmin auto') : ('auto ' + pct + 'vmin');
  layer.style.backgroundRepeat = cfg.overlayTile ? 'repeat' : 'no-repeat';
  layer.style.backgroundPosition = cfg.overlayTile ? 'center' : (OVERLAY_POS[cfg.overlayPos] || 'center center');
  layer.style.opacity = Math.max(0, Math.min(1, cfg.overlayOpacity === undefined ? 0.5 : +cfg.overlayOpacity));
  // behind the board (1) or over it as a watermark (3) - still never clickable,
  // and always under the name prompt / leaderboard sheet at 5
  layer.style.zIndex = cfg.overlayFront ? 3 : 1;
}

let lastBgKey = null;
function paintBackground(cfg){
  const key = [cfg.bgMode, cfg.bgPreset, cfg.bgMode === 'custom' ? cfg.bgHtml : '',
               cfg.accent, cfg.brickColors[0], cfg.brickColors[5]].join('|');
  if(key === lastBgKey) return;        // don't restart animations on every tweak
  lastBgKey = key;
  const layer = $('bgLayer');
  layer.innerHTML = '';

  if(cfg.bgMode === 'preset'){
    const d = document.createElement('div');
    d.className = 'preset-bg ' + cfg.bgPreset;
    d.style.setProperty('--a1', cfg.accent);
    d.style.setProperty('--a2', cfg.brickColors[0] || '#f72585');
    d.style.setProperty('--a3', cfg.brickColors[5] || '#3ddc97');
    layer.appendChild(d);
  } else if(cfg.bgMode === 'custom' && cfg.bgHtml.trim()){
    // Sandboxed: the pasted markup can animate, but it cannot reach this page,
    // its cookies, or the network.
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', '');
    f.setAttribute('referrerpolicy', 'no-referrer');
    f.srcdoc = '<!DOCTYPE html><meta charset="utf-8">' +
      '<style>html,body{margin:0;height:100%;overflow:hidden;background:transparent}</style>' +
      cfg.bgHtml;
    layer.appendChild(f);
  }
}

/* ---------------- HUD ---------------- */
const fmtTime = sec => {
  const t = Math.max(0, Math.ceil(sec));
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
};

const hud = s => {
  $('score').textContent = s.score;
  $('lives').textContent = s.lives;
  $('level').textContent = s.level;
  const dig = s.mode === 'dig';
  $('timeBox').hidden = !dig;
  $('levelBox').hidden = dig;            // in dig mode a level number means nothing
  if(dig && s.timeLeft !== null && s.timeLeft !== undefined){
    $('time').textContent = fmtTime(s.timeLeft);
    $('time').style.color = s.timeLeft <= 10 ? '#ff5d73'
      : (CONFIG.accentTextColor || CONFIG.accent || '');
  }
};

/* ---------------- overlays ---------------- */
function closeOverlay(){
  overlayMode = null;
  $('overlay').classList.remove('on');
  if(game){ game.setBlocked(false); game.resume(); }
}
function openOverlay(mode, html){
  overlayMode = mode;
  $('sheet').innerHTML = html;
  $('overlay').classList.add('on');
  if(game){ game.pause(); game.setBlocked(true); }
}

function boardHtml(highlight){
  if(!SCORES.length) return '<div class="none">Brak wyników. Bądź pierwszy.</div>';
  return '<ol class="board">' + SCORES.map((s, i) =>
    '<li class="' + (highlight && s === highlight ? 'me' : '') + '">' +
      '<span class="rank">' + (i + 1) + '</span>' +
      '<span class="nm">' + esc(s.name) + '</span>' +
      '<span class="lv"></span>' +
      '<span class="sc">' + s.score + '</span>' +
    '</li>').join('') + '</ol>';
}

function askName(){
  openOverlay('name',
    '<h2>Kto gra?</h2>' +
    '<p>Twój wynik trafi na listę pod tą nazwą.</p>' +
    '<input type="text" id="nameInput" maxlength="24" placeholder="Imię gracza" autocomplete="off">' +
    '<div class="btns">' +
      '<button class="b primary" id="startBtn">Start</button>' +
      '<button class="b" id="boardBtn">Wyniki (P)</button>' +
    '</div>');
  const input = $('nameInput');
  input.value = player || '';
  setTimeout(() => input.focus(), 30);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') begin(input.value); });
  $('startBtn').onclick = () => begin(input.value);
  $('boardBtn').onclick = () => showBoard();
}

function showBoard(){
  openOverlay('board',
    '<h2>Najlepsze wyniki</h2>' +
    '<p>' + (SCORES.length ? 'Czołówka tej gry.' : 'Jeszcze nikt nie grał.') + '</p>' +
    boardHtml(lastScore) +
    '<div class="btns"><button class="b primary" id="closeBtn">Wróć (P)</button></div>');
  $('closeBtn').onclick = () => backFromBoard();
}

function backFromBoard(){
  // At the name prompt P is a detour, not a pause - go back to the prompt.
  if(!game || !player) askName();
  else closeOverlay();
}

function gameOver(res){
  lastScore = null;
  const submit = SLUG ? postScore(res) : Promise.resolve();
  const title = res.won ? 'Wygrana!' : (res.timedOut ? 'Koniec czasu' : 'Koniec gry');
  let sub = esc(player || 'Gracz');
  if(res.won && res.timeLeft !== null && res.timeLeft !== undefined){
    sub += ' — zostało ' + fmtTime(res.timeLeft);
  } else if(CONFIG.mode !== 'dig'){
    sub += ' — poziom ' + res.level;
  }
  // On a win, hold the sheet back so the cube's explosion is actually watched.
  const show = () => {
  openOverlay('over',
    '<h2>' + title + '</h2>' +
    '<p>' + sub + '</p>' +
    '<div class="big">' + res.score + '</div>' +
    '<div id="rankLine" class="none">Zapisywanie…</div>' +
    '<div class="btns">' +
      '<button class="b primary" id="nextBtn">Następny gracz</button>' +
      '<button class="b" id="boardBtn2">Wyniki (P)</button>' +
    '</div>');
  $('nextBtn').onclick  = () => { player = ''; askName(); };
  $('boardBtn2').onclick = () => showBoard();

  submit.then(rank => {
    const line = $('rankLine');
    if(!line) return;
    if(!SLUG) line.textContent = 'Podgląd — wyniki nie są zapisywane.';
    else if(rank > 0) line.textContent = 'Miejsce ' + rank + ' z ' + SCORES.length + '.';
    else line.textContent = 'Zapisano.';
  });
  };

  if(res.won) setTimeout(show, WIN_FX_MS); else show();
}

async function postScore(res){
  try{
    const r = await fetch('/g/' + SLUG + '/scores', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, name: player || 'Gracz',
                             score: res.score, level: res.level })
    });
    if(!r.ok) return 0;
    const data = await r.json();
    TOKEN = data.token;
    SCORES = data.scores;
    lastScore = SCORES.find(s => s.name === (player || 'Gracz') && s.score === res.score) || null;
    return lastScore ? SCORES.indexOf(lastScore) + 1 : 0;
  } catch(_e){ return 0; }
}

/* ---------------- start / restart ---------------- */
function begin(name){
  player = (name || '').trim().slice(0, 24) || 'Gracz';
  $('who').textContent = 'Gra: ' + player;
  closeOverlay();
  if(game) game.restart(CONFIG);
  else game = makeGame();
  game.setBlocked(false);
}

/* A key pressed inside a text field belongs to the field. Without this, typing
   a name with P in it opened the leaderboard instead of typing the letter. */
function isTyping(e){
  const t = e.target;
  return !!t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
}

/* P toggles the board from anywhere; Esc closes it too. */
addEventListener('keydown', e => {
  if(isTyping(e)) return;
  if(e.code === 'KeyP'){
    e.preventDefault();
    if(overlayMode === 'board') backFromBoard();
    else if(overlayMode === 'over' || overlayMode === 'name' || overlayMode === null) showBoard();
  }
  if(e.code === 'Escape' && overlayMode === 'board'){ e.preventDefault(); backFromBoard(); }
});

paintChrome(CONFIG);

if(PREVIEW || !CONFIG.askName){
  // The editor preview plays immediately - no name gate in the way of design work.
  player = PREVIEW ? 'Podgląd' : 'Gracz';
  if(!PREVIEW) $('who').textContent = 'Gra: ' + player;
  game = makeGame();
} else {
  game = makeGame();
  game.pause(); game.setBlocked(true);
  askName();
}

if(PREVIEW){
  // The editor drives this frame over postMessage; same-origin only.
  addEventListener('message', e => {
    if(e.origin !== location.origin) return;
    const msg = e.data;
    if(!msg || msg.type !== 'arcade:config') return;
    CONFIG = Object.assign({}, CONFIG, msg.config);
    paintChrome(CONFIG);
    if(msg.restart) game.restart(CONFIG); else game.setConfig(CONFIG);
  });
  parent.postMessage({ type: 'arcade:ready' }, location.origin);
}
</script>
</body>
</html>
