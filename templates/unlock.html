<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }} — locked</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<div class="center">
  <div class="auth">
    <div class="card">
      <h2>{{ title }}</h2>
      <p class="sub">This game is password protected.</p>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <form method="post">
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autofocus autocomplete="off">
        </div>
        <button class="btn primary" type="submit" style="width:100%;justify-content:center">Play</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
