<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade — sign in</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<div class="center">
  <div class="auth">
    <div class="card">
      <h2>Arcade</h2>
      <p class="sub">Sign in to build and deploy game instances.</p>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <form method="post">
        <div class="field">
          <label for="password">Admin password</label>
          <input type="password" id="password" name="password" autofocus autocomplete="current-password">
          {% if default_hint %}
          <div class="hint">No <code>ARCADE_ADMIN_PASSWORD</code> set — the password is <b>admin</b>.</div>
          {% endif %}
        </div>
        <button class="btn primary" type="submit" style="width:100%;justify-content:center">Sign in</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
